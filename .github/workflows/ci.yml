
name: QA API Automation - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  automated-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'

      - name: Run automated tests
        run: mvn clean test
